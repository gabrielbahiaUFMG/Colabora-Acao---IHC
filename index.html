<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colabora & Ação — Protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eef0;--card:#fff;--ink:#16262b;--mut:#5b6e74;--pri:#1c6e7d;--onpri:#fff;--acc:#f2a93b;--ok:#2e8b57;--bad:#c4452f;--line:#d5e0e3;--phone:#f6fafb;--frame:#16262b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;justify-content:center}
.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}
.top button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
#app{position:relative;width:min(390px,100%);height:min(740px,calc(100vh - 90px));min-height:520px;background:var(--phone);border-radius:28px;border:6px solid var(--frame);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--pri);color:var(--onpri)}
.hd b{font-size:18px;font-weight:800}.hd span{font-size:14px;opacity:.9}
main{flex:1;overflow:auto;padding:14px}
h2{font-size:20px;margin:0 0 8px;font-weight:800}h3{margin:0 0 4px;font-size:19px}
p{margin:6px 0}.mut,small{color:var(--mut)}.bad{color:var(--bad)}.note{background:var(--card);border-left:4px solid var(--acc);padding:8px 10px;border-radius:8px;font-size:14px}
.tk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left-width:5px;border-radius:14px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer}
.tk .em{font-size:26px}.tn{flex:1;display:flex;flex-direction:column}.tn small{font-size:13px}
.pt{font-weight:800;font-size:20px;color:var(--pri);text-align:center;line-height:1}.pt small{display:block;font-size:11px;font-weight:400}
.tk.res{border-color:#93c5fd;border-left-color:#2563eb;background:#f0f7ff}
.tk.pend,.tk.conv{border-color:var(--acc);border-left-color:var(--acc);background:#fffbeb}
.tk.ok{border-color:var(--ok);border-left-color:var(--ok);background:#f2fbf6}
.tk.rec,.tk.cont{border-color:var(--bad);border-left-color:var(--bad);background:#fdf2f0}
.st-tag{display:inline-block;font-weight:700;padding:1px 6px;border-radius:6px;font-size:12px;margin-top:2px;width:fit-content}
.tk.res .st-tag{background:#dbeafe;color:#1e40af}
.tk.rec .st-tag,.tk.cont .st-tag{background:#fee2e2;color:#991b1b}
.tk.pend .st-tag,.tk.conv .st-tag{background:#fef3c7;color:#92400e}
.tk.ok .st-tag{background:#dcfce7;color:#166534}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 10px;font:inherit;font-size:12px;cursor:pointer;position:relative}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:800}
nav i{position:absolute;top:4px;right:22%;background:var(--bad);color:#fff;font-style:normal;font-size:11px;border-radius:10px;padding:0 6px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 16px;max-height:85%;overflow:auto}
.b,.g{display:block;width:100%;margin:8px 0 0;padding:12px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--pri)}
.b{background:var(--pri);color:var(--onpri)}.g{background:none;color:var(--pri)}
.b:disabled,.g:disabled{opacity:.4;cursor:not-allowed}
textarea,input[type=text],input[type=number],select{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--phone);color:var(--ink);font:inherit}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}.ck{color:var(--ink);font-size:16px}
.req-hint{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 12px}.bar div{height:100%;background:var(--pri)}.bar.c div{background:var(--acc)}
.row{display:flex;justify-content:space-between;font-weight:700}
.ts{position:absolute;left:14px;right:14px;bottom:70px;background:var(--ink);color:var(--phone);padding:10px 14px;border-radius:12px;text-align:center;font-size:14px}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>
<div class="top" id="top"></div>
<div id="app"></div>
<script>
const D={1:'Lavar e secar os pratos e talheres do almoço.',2:'Tirar as roupas do varal, dobrar e guardar.',3:'Levar o lixo da cozinha até a lixeira da rua.',4:'Fazer a cama e guardar roupas e brinquedos.',5:'Passeio de 20 minutos: um leva, o outro ajuda.'},AGE={Rafael:1,Bia:1.5},KIDS=['Rafael','Bia'],CH={livre:'Livre',res:'Reservada',conv:'Convite pendente',pend:'Aguardando confirmação',ok:'Aprovada',rec:'Recusada',cont:'Em contestação'};
let me='Bia',tab='mural',sheet=null,mode='ativa',toast='',S,T,season=3,nc=null,cfg;
function init(){T=[{id:1,n:'Lavar a louça',e:'🍽️',p:20,s:'pend',by:'Rafael'},{id:2,n:'Recolher as roupas do varal',e:'👕',p:15,s:'livre'},{id:3,n:'Levar o lixo para fora',e:'🗑️',p:10,s:'livre'},{id:4,n:'Arrumar o quarto',e:'🛏️',p:15,s:'livre'},{id:5,n:'Passear com a Mel',e:'🐕',p:40,s:'livre',dupla:1}];T.forEach(t=>t.d=D[t.id]);S={Rafael:60,Bia:45};cfg={dias:14,meta:150,premio:'Pizza em família',foto:0};nc=null;mode='ativa';season=3;sheet=null;tab='mural';toast=''}
init();
const R=()=>me==='Sandra'||me==='Carlos',A=()=>me==='Sandra',oth=()=>me==='Bia'?'Rafael':'Bia',pts=t=>Math.round(t.p*(R()?1:AGE[me]));
const $=id=>document.getElementById(id);
let tt;function say(m){toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{toast='';const e=document.querySelector('.ts');if(e)e.remove()},2500)}
function warn(m){const e=document.createElement('div');e.className='ts';e.textContent=m;$('app').appendChild(e);setTimeout(()=>e.remove(),2500)}
function cl(){sheet=null;render()}
function go(t){tab=t;sheet=null;render()}
function who(n){me=n;tab='mural';sheet=null;render()}
function render(){
 const n=T.filter(t=>t.s=='pend'||t.s=='cont').length;
 const b=tab=='mural'?mural():tab=='placar'?placar():tab=='val'?val():temp();
 const tabs=[['mural','📋','Mural'],['placar','🏆','Placar'],...(R()?[['val','✅','Validar']]:[]),['temp','🗓️','Temporada']];
 $('top').innerHTML='<span>Ver como:</span>'+['Rafael','Bia','Sandra','Carlos'].map(x=>`<button class="${x==me?'on':''}" onclick="who('${x}')">${x}${x=='Sandra'||x=='Carlos'?' (responsável)':''}</button>`).join('')+'<button onclick="init();render()">Reiniciar</button>';
 $('app').innerHTML=`<div class=hd><b>Colabora & Ação</b><span>Olá, ${me}${S[me]!=null?' · ⭐ '+S[me]:''}</span></div><main>${b}</main><nav>${tabs.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}${x[0]=='val'&&n?`<i>${n}</i>`:''}</button>`).join('')}</nav>${sheet?`<div class=ov onclick="if(event.target==this)cl()"><div class=sh>${sheet}</div></div>`:''}${toast?`<div class=ts>${toast}</div>`:''}`}
const card=(t,f)=>`<button class="tk ${t.s}" onclick="${f}(${t.id})"><span class=em>${t.e}</span><span class=tn><b>${t.n}</b><small>${t.dupla?'Em dupla · ':''}${t.by?t.by+' · ':''}<span class="${t.s!='livre'?'st-tag':''}">${CH[t.s]}</span></small></span><span class=pt>${pts(t)}<small>pts</small></span></button>`;
function mural(){return `<h2>Tarefas da temporada</h2>${R()?`<p class=note>${T.filter(t=>t.s=='pend'||t.s=='cont').length} para validar · família ${S.Rafael+S.Bia} de ${cfg.meta} pts</p>`:'<p class=note>Os pontos são ajustados pela idade, para a disputa ser igual para todos.</p>'}<button class=g onclick="rules()">Como funcionam os pontos?</button>`+T.map(t=>card(t,'op')).join('')}
function op(id){const t=T.find(x=>x.id==id);let h=`<h3>${t.e} ${t.n}</h3><p class=mut>Vale ${pts(t)} pts${t.dupla?' · tarefa em dupla':''}</p><p>${t.d}</p>`;
 const mine=t.by==me||t.par==me;
 if(R())h+=`<p>${t.s=='livre'?'Ainda ninguém reservou esta tarefa.':CH[t.s]+' · '+t.by}</p>`;
 else if(t.s=='livre'){if(t.dupla)h+=`<button class=b onclick="rs(${id},1)">Reservar com ${oth()}</button>`;h+=`<button class="${t.dupla?'g':'b'}" onclick="rs(${id},0)">Reservar para mim</button>`}
 else if(t.s=='conv'){h+=t.par==me?`<p>${t.by} convidou você para esta tarefa.</p><button class=b onclick="ac(${id},1)">Aceitar convite</button><button class=g onclick="ac(${id},0)">Recusar</button>`:t.by==me?`<p>Aguardando ${t.par} aceitar o convite.</p><button class=g onclick="cn(${id})">Cancelar convite</button>`:'<p>Convite em andamento.</p>'}
 else if(t.s=='res'&&mine)h+=`${cfg.foto?'<label class=ck><input type=checkbox id=ft> Adicionar foto (opcional)</label>':''}<button class=b onclick="rg(${id})">Registrar conclusão</button><button class=g onclick="cn(${id})">Cancelar reserva</button>`;
 else if(t.s=='rec'&&mine&&!t.fin)h+=`<p class=bad>Motivo da recusa: “${t.m}”</p><label for=ct>Justificativa da contestação *</label><textarea id=ct rows=3 placeholder="Explique por que você discorda" oninput="$('cb').disabled=!this.value.trim();$('ct-h').textContent=this.value.trim()?'Pronto para enviar.':'Campo obrigatório: preencha o motivo acima para habilitar o envio.'"></textarea><small id=ct-h class=req-hint>Campo obrigatório: preencha o motivo acima para habilitar o envio.</small><button class=b id=cb disabled onclick="ct(${id})">Contestar recusa</button>`;
 else h+=`<p>${{res:'Reservada por '+t.by+'.',pend:'Aguardando a confirmação de Sandra.',ok:'Aprovada. Os pontos já foram somados.',rec:'Recusa mantida: “'+t.m+'”',cont:'Contestação enviada. Sandra vai reavaliar.'}[t.s]}</p>`;
 sheet=h+'<button class=g onclick="cl()">Fechar</button>';render()}
function rs(id,d){const t=T.find(x=>x.id==id);t.s=d?'conv':'res';t.by=me;t.par=d?oth():null;sheet=null;say(d?'Convite enviado a '+oth()+'.':'Tarefa reservada. Quando terminar, registre a conclusão.')}
function ac(id,y){const t=T.find(x=>x.id==id);if(y)t.s='res';else{t.s='livre';t.by=t.par=null}sheet=null;say(y?'Convite aceito. Quando terminarem, registrem a conclusão.':'Convite recusado.')}
function cn(id){const t=T.find(x=>x.id==id);t.s='livre';t.by=t.par=null;sheet=null;say('Reserva cancelada.')}
function rg(id){const t=T.find(x=>x.id==id);const f=$('ft');t.f=!!(f&&f.checked);t.s='pend';sheet=null;say('Enviado! Sandra vai confirmar.')}
function ct(id){const t=T.find(x=>x.id==id);t.c=$('ct').value.trim();t.s='cont';sheet=null;say('Contestação enviada a Sandra.')}
function val(){const l=T.filter(t=>t.s=='pend'||t.s=='cont');return `<h2>Conclusões para validar</h2>${l.length?l.map(t=>card(t,'vo')).join(''):'<p class=mut>Nada pendente. Quando alguém registrar uma tarefa, ela aparece aqui.</p>'}`}
function vo(id){const t=T.find(x=>x.id==id);let h=`<h3>${t.e} ${t.n}</h3><p class=mut>${t.by}${t.par?' e '+t.par:''} marcou como concluída${t.f?' · com foto 📷':''}</p>`;
 if(t.s=='cont')h+=`<p class=bad>Você recusou: “${t.m}”</p><p>Contestação: “${t.c}”</p><textarea id=nd rows=2 placeholder="Atualizar a descrição da tarefa (opcional)"></textarea><button class=b onclick="ap(${id})">Aceitar contestação</button><button class=g onclick="mt(${id})">Manter recusa</button>`;
 else h+=`<button class=b onclick="ap(${id})">Aprovar conclusão</button><label for=mo>Motivo da recusa *</label><textarea id=mo rows=2 placeholder="Motivo da recusa (obrigatório)" oninput="$('rb').disabled=!this.value.trim();$('mo-h').textContent=this.value.trim()?'Pronto para recusar.':'Campo obrigatório: preencha o motivo acima para habilitar o envio.'"></textarea><small id=mo-h class=req-hint>Campo obrigatório: preencha o motivo acima para habilitar o envio.</small><button class=g id=rb disabled onclick="rc(${id})">Recusar conclusão</button>`;
 sheet=h+'<button class=g onclick="cl()">Fechar</button>';render()}
function ap(id){const t=T.find(x=>x.id==id);t.s='ok';const nd=$('nd');if(nd&&nd.value.trim())t.d=nd.value.trim();[t.by,t.par].filter(Boolean).forEach(k=>S[k]+=Math.round(t.p*AGE[k]));sheet=null;say('Aprovada! Pontos somados.')}
function rc(id){const t=T.find(x=>x.id==id);t.m=$('mo').value.trim();t.s='rec';sheet=null;say('Recusada. O motivo foi enviado a '+t.by+'.')}
function mt(id){const t=T.find(x=>x.id==id);t.s='rec';t.fin=1;sheet=null;say('Recusa mantida.')}
function placar(){const tot=S.Rafael+S.Bia,mx=Math.max(S.Rafael,S.Bia,1);
 return `<h2>Placar</h2>`+KIDS.map(k=>`<div class=row><span>${k}</span><span>${S[k]} pts</span></div><div class=bar><div style="width:${S[k]/mx*100}%"></div></div>`).join('')+`<h2>🍕 Meta da família</h2><div class=row><span>${cfg.premio}</span><span>${tot} / ${cfg.meta}</span></div><div class="bar c"><div style="width:${Math.min(100,tot/cfg.meta*100)}%"></div></div><p class=mut>Todos somam pontos para a meta coletiva.</p>${tot>=cfg.meta?'<p class=note>🎉 Meta atingida! Hora de celebrar: '+cfg.premio+'</p>':''}`}
function temp(){const tot=S.Rafael+S.Bia;
 if(mode=='ativa')return `<h2>Temporada ${season}</h2><p>${cfg.dias} dias · prêmio coletivo: ${cfg.premio}</p><p class=mut>Pontos da família: ${tot} de ${cfg.meta}</p>${A()?'<button class=b onclick="mode=\'retro\';render()">Encerrar temporada</button>':''}`;
 if(mode=='retro')return `<h2>Retrospectiva da temporada ${season}</h2><p>✅ ${T.filter(t=>t.s=='ok').length} tarefas aprovadas</p><p>🏆 Rafael ${S.Rafael} pts · Bia ${S.Bia} pts</p><p>🍕 Meta da família: ${tot} de ${cfg.meta}</p>${tot>=cfg.meta?'<p class=note>🎉 Meta atingida! Hora de celebrar: '+cfg.premio+'</p>':''}${T.some(t=>t.s=='livre')?'<p class=note>Pouco feitas nesta temporada: '+T.filter(t=>t.s=='livre').map(t=>t.n).join(', ')+'. Que tal revisar o valor?</p>':''}${A()?'<button class=b onclick="mode=\'config\';render()">Configurar nova temporada</button>':'<p class=mut>Sandra vai montar a próxima temporada com você.</p>'}`;
 if(mode=='config'){if(!A())return '<h2>Nova temporada</h2><p class=mut>Sandra está ajustando a proposta.</p>';
  return `<h2>Nova temporada</h2>${cfg.adj?`<p class=note>Pedido de ajuste: “${cfg.adj}”</p>`:''}<label>Duração<select id=cd><option value=7>7 dias</option><option value=14 selected>14 dias</option><option value=30>30 dias</option></select></label><label>Meta coletiva (pontos)<input type=number id=cm value=${cfg.meta}></label><label>Prêmio da família<input type=text id=cp value="${cfg.premio}"></label><label class=ck><input type=checkbox id=ph ${cfg.foto?'checked':''}> Permitir fotos na validação</label><h3 style="margin-top:14px">Catálogo de tarefas</h3>${T.map(t=>`<div class=row><label class=ck style="margin:6px 0 0"><input type=checkbox id=ti${t.id} checked> ${t.e} ${t.n}</label></div><div class=row><input type=number id=tp${t.id} value=${t.p} style="width:80px;margin-top:2px"><label class=ck style="margin:0"><input type=checkbox id=td${t.id} ${t.dupla?'checked':''}> em dupla</label></div>`).join('')}<button class=b onclick="sp()">Enviar proposta aos filhos</button><button class=g onclick="mode=\'retro\';render()">Cancelar</button>`}
 if(!R())return `<h2>Proposta da nova temporada</h2><p>${cfg.dias} dias · meta de ${cfg.meta} pts</p><p>Tarefas: ${T.filter(t=>nc[t.id].on).map(t=>t.e+' '+t.n+' ('+nc[t.id].p+')').join(', ')}</p><p>Fotos: ${cfg.foto?'permitidas':'desativadas'}</p><p>Prêmio: ${cfg.premio}</p><button class=b onclick="ok2()">Aprovar proposta</button><textarea id=aj rows=2 placeholder="O que você quer ajustar? (opcional)"></textarea><button class=g onclick="pa()">Pedir ajuste</button>`;
 return `<h2>Proposta enviada</h2><p class=mut>Aguardando a aprovação de Rafael e Bia.</p>`}
function sp(){const m=+$('cm').value,p=$('cp').value.trim();if(!(m>0)||!p){warn('Informe uma meta maior que zero e um prêmio.');return}
 const n={};T.forEach(t=>n[t.id]={on:$('ti'+t.id).checked,p:+$('tp'+t.id).value,d:$('td'+t.id).checked});const v=Object.values(n);
 if(!v.some(x=>x.on)||v.some(x=>x.on&&!(x.p>0))){warn('Escolha ao menos uma tarefa e informe pontos maiores que zero.');return}
 nc=n;cfg={dias:+$('cd').value,meta:m,premio:p,foto:$('ph').checked};mode='prop';say('Proposta enviada aos filhos.')}
function pa(){cfg.adj=$('aj').value.trim();mode='config';say('Pedido de ajuste enviado a Sandra.')}
function rules(){sheet='<h3>Como funcionam os pontos</h3><p class=mut>Combinado pela família. Vale para todos.</p><p>Cada tarefa é ajustada pela idade para a disputa ser igual:</p><div class=row><span>Rafael · 15 anos</span><span>×1</span></div><div class=row><span>Bia · 9 anos</span><span>×1,5</span></div><p class=mut>Sandra e Carlos veem o valor base de cada tarefa.</p><button class=g onclick="cl()">Fechar</button>';render()}
function ok2(){const c=cfg,n=nc;init();c.adj='';cfg=c;nc=null;S={Rafael:0,Bia:0};T=T.filter(t=>!n||n[t.id].on).map(t=>({...t,s:'livre',by:null,par:null,f:0,p:n?n[t.id].p:t.p,dupla:n?n[t.id].d:t.dupla}));season=4;say('Temporada 4 iniciada. Pontos zerados. Boa sorte!')}
render();
</script></body></html>
